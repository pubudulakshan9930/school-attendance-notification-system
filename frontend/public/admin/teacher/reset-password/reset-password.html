<!doctype html>
<html lang="en" class="admin-font-smaller">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Setup or Reset Password</title>
    <link rel="stylesheet" href="../../../assets/css/global.css" />
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        background: linear-gradient(135deg, #f4f7fb 0%, #e9eef8 100%);
        color: #10223d;
        font-family: "Poppins", sans-serif;
      }

      .reset-shell {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
      }

      .reset-card {
        width: min(100%, 520px);
        background: #ffffff;
        border-radius: 20px;
        box-shadow: 0 16px 48px rgba(16, 34, 61, 0.16);
        padding: 32px;
      }

      .reset-card h1 {
        margin: 0 0 8px;
        font-size: 1.7rem;
      }

      .reset-card p {
        margin: 0 0 20px;
        color: #4d5970;
        line-height: 1.6;
      }

      .form-message {
        padding: 12px 14px;
        border-radius: 10px;
        margin-bottom: 18px;
        font-size: 0.95rem;
        display: none;
      }

      .form-message.error {
        display: block;
        background: #fde7e7;
        color: #b42318;
        border: 1px solid #f5b7b7;
      }

      .form-message.success {
        display: block;
        background: #e8f7ee;
        color: #087443;
        border: 1px solid #b8e5c7;
      }

      .field-label {
        display: block;
        margin-bottom: 6px;
        font-weight: 600;
      }

      .input-field {
        width: 100%;
        border: 1px solid #cbd5e1;
        border-radius: 10px;
        padding: 12px 14px;
        margin-bottom: 14px;
        font-size: 1rem;
        box-sizing: border-box;
      }

      .input-field:focus {
        outline: 2px solid rgba(16, 34, 61, 0.18);
        border-color: #10223d;
      }

      .primary-btn {
        width: 100%;
        border: none;
        border-radius: 10px;
        background: #10223d;
        color: #ffffff;
        padding: 12px 16px;
        font-size: 1rem;
        font-weight: 600;
        cursor: pointer;
      }

      .secondary-link {
        display: inline-block;
        margin-top: 16px;
        color: #10223d;
        text-decoration: none;
        font-weight: 600;
      }

      .hidden {
        display: none;
      }
    </style>
  </head>
  <body>
    <main class="reset-shell">
      <section class="reset-card" aria-label="Teacher password reset flow">
        <h1>Setup or Reset Password</h1>
        <p>
          Enter the phone number used during registration to receive a one-time
          verification code.
        </p>

        <div
          id="resetMessage"
          class="form-message"
          role="status"
          aria-live="polite"
        ></div>

        <form id="passwordResetRequestForm">
          <div id="requestStep">
            <label class="field-label" for="resetPhone"
              >Registered phone number</label
            >
            <input id="resetPhone" class="input-field" type="tel" required />
            <button class="primary-btn" type="submit">Verify</button>
          </div>
        </form>

        <form id="passwordResetVerifyForm" class="hidden">
          <div id="verifyStep" class="hidden">
            <label class="field-label" for="resetOtp">OTP code</label>
            <input
              id="resetOtp"
              class="input-field"
              type="text"
              inputmode="numeric"
              autocomplete="one-time-code"
              required
            />

            <label class="field-label" for="resetPassword">New password</label>
            <input
              id="resetPassword"
              class="input-field"
              type="password"
              minlength="6"
              required
            />

            <label class="field-label" for="resetConfirmPassword"
              >Confirm password</label
            >
            <input
              id="resetConfirmPassword"
              class="input-field"
              type="password"
              minlength="6"
              required
            />

            <button class="primary-btn" type="submit">Update Password</button>
          </div>
        </form>

        <a class="secondary-link" href="../../../index.html">Back to login</a>
      </section>
    </main>

    <script src="reset-password.js"></script>
  </body>
</html>
