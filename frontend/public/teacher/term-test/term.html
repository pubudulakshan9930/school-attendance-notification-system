<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Term Test Marks</title>
    <link rel="stylesheet" href="../../assets/css/global.css" />
    <link rel="stylesheet" href="../../assets/css/components.css" />
    <link rel="stylesheet" href="term.css" />
  </head>

  <body>
    <main class="term-page">
      <header class="page-header">
        <a
          class="back-button"
          href="../dashboard.html"
          aria-label="Back to Dashboard"
          >←</a
        >
        <div>
          <h3>Term Test Marks</h3>
          <p>
            Select a term first, then choose a student and enter their subject
            marks.
          </p>
        </div>
      </header>

      <section class="term-select card">
        <label for="termSelect">Select Term</label>
        <select id="termSelect">
          <option value="">Select Term</option>
          <option value="1">First Term</option>
          <option value="2">Second Term</option>
          <option value="3">Third Term</option>
        </select>
      </section>
    </main>

    <script src="../../assets/js/teacher-auth.js"></script>
    <script src="term.js"></script>
  </body>
</html>
