<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Term Test Marks</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:opsz,wght@6..144,1..1000&family=Patrick+Hand&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../../assets/css/global.css" />
    <link rel="stylesheet" href="../../assets/css/components.css" />
    <link rel="stylesheet" href="term.css" />
  </head>

  <body>
    <main class="term-page">
      <header class="page-header">
        <div class="header-content">
          <h1>📚 Term Test Marks</h1>
          <p class="header-subtitle">
            Select a term to begin entering student marks
          </p>
        </div>
      </header>

      <section class="term-selector-container">
        <div class="term-selector-card">
          <div class="term-selector-header">
            <h2>Choose Term</h2>
            <p>Select which term you want to enter marks for</p>
          </div>

          <div class="term-buttons-grid">
            <button
              type="button"
              class="term-button term-button-1"
              data-term="1"
            >
              <span class="term-icon">I</span>
              <span class="term-label">First Term</span>
              <span class="term-subtitle">Jan - Apr</span>
            </button>

            <button
              type="button"
              class="term-button term-button-2"
              data-term="2"
            >
              <span class="term-icon">II</span>
              <span class="term-label">Second Term</span>
              <span class="term-subtitle">May - Aug</span>
            </button>

            <button
              type="button"
              class="term-button term-button-3"
              data-term="3"
            >
              <span class="term-icon">III</span>
              <span class="term-label">Third Term</span>
              <span class="term-subtitle">Sep - Dec</span>
            </button>
          </div>
        </div>
      </section>
    </main>

    <script src="../../assets/js/teacher-auth.js"></script>
    <script src="term.js"></script>
  </body>
</html>
