<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mark Attendance</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:opsz,wght@6..144,1..1000&family=Patrick+Hand&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../../assets/css/global.css" />
    <link rel="stylesheet" href="../../assets/css/components.css" />
    <link rel="stylesheet" href="attendance.css" />
  </head>

  <body>
    <div class="page">
      <header class="header">
        <div class="header-content">
          <div class="attendance-info">
            <p class="header-kicker">Attendance Date</p>
            <h1 class="attendance-date" id="attendanceDate">Today</h1>
            <p class="class-info" id="classInfo">Grade - Class</p>
          </div>
        </div>
      </header>

      <main class="main">
        <div class="attendance-container">
          <div class="attendance-stats" aria-hidden="false">
            <div class="stat-card present-card">
              <div class="stat-value" id="presentCount">0</div>
              <div class="stat-label">Present</div>
            </div>
            <div class="stat-card absent-card">
              <div class="stat-value" id="absentCount">0</div>
              <div class="stat-label">Absent</div>
            </div>
            <div class="stat-card late-card">
              <div class="stat-value" id="lateCount">0</div>
              <div class="stat-label">Late</div>
            </div>
          </div>
          <div class="filter-bar">
            <select id="filterStatus" class="filter-select">
              <option value="all">All Students</option>
              <option value="marked">Marked</option>
              <option value="unmarked">Not Marked</option>
            </select>
          </div>

          <div
            class="attendance-window-status"
            style="
              padding: 12px 16px;
              margin-bottom: 16px;
              border-radius: 8px;
              background: #dcfce7;
              color: #166534;
              font-weight: 500;
              font-size: 0.95rem;
              border-left: 4px solid #16a34a;
            "
          >
            ⏱ Loading attendance window status...
          </div>

          <div id="studentCardsContainer" class="students-grid"></div>

          <div class="actions">
            <button id="saveAttendanceButton" class="btn-primary" type="button">
              Save Attendance
            </button>
            <button
              id="notifyParentsButton"
              class="btn-secondary"
              type="button"
            >
              Notify Parents
            </button>
          </div>
        </div>
      </main>
    </div>

    <script src="../../assets/js/class-stream-utils.js"></script>
    <script src="../../assets/js/teacher-auth.js"></script>
    <script src="attendance.js"></script>
  </body>
</html>
