services:
  - type: web
    name: sureki-app
    env: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 45m
      - key: DATABASE_URL
        fromDatabase:
          name: sureki-db
          property: connectionString

databases:
  - name: sureki-db
    databaseName: sureki
    user: sureki
    plan: free
